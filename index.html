<title>Pauta isadsign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">
/* Layout: frosted top bar, briefing panel at left (sticky on wide screens), result canvas at right; stacks to one column on phones. Scales type up on TVs. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f0f0f3; --fg:#1d1d1f; --fg-2:#6e6e73; --line:rgba(0,0,0,.09);
  --accent:#d6237f; --accent-soft:rgba(214,35,127,.1); --on-accent:#ffffff;
  --c-car:#d6237f; --c-reel:#5856d6; --c-est:#c76a00; --c-sto:#248a3d;
  --bar:rgba(245,245,247,.78); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
  --danger:#d70015; --scrim-ink:rgba(0,0,0,.62);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:1.375rem; --r-md:0.875rem; --r-sm:0.625rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f5f5f7; --fg-2:#98989d; --line:rgba(255,255,255,.1);
  --accent:#ff4fa3; --accent-soft:rgba(255,79,163,.16); --on-accent:#1a0010;
  --c-car:#ff4fa3; --c-reel:#7d7aff; --c-est:#ffb340; --c-sto:#4cd964;
  --bar:rgba(22,22,24,.72); --shadow:0 1px 2px rgba(0,0,0,.4); --danger:#ff6961; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f5f5f7; --fg-2:#98989d; --line:rgba(255,255,255,.1);
  --accent:#ff4fa3; --accent-soft:rgba(255,79,163,.16); --on-accent:#1a0010;
  --c-car:#ff4fa3; --c-reel:#7d7aff; --c-est:#ffb340; --c-sto:#4cd964;
  --bar:rgba(22,22,24,.72); --shadow:0 1px 2px rgba(0,0,0,.4); --danger:#ff6961; color-scheme:dark}

html{font-size:16px;-webkit-text-size-adjust:100%}
@media (min-width:1800px){html{font-size:19px}}
@media (min-width:2400px){html{font-size:24px}}
@media (min-width:3200px){html{font-size:30px}}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}

.wrap{max-width:82rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;height:3.25rem}
.brand{font-weight:600;font-size:1.0625rem;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.brand small{font-weight:400;color:var(--fg-2);margin-left:.35rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:.6rem;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:.3rem .85rem;border-radius:.5rem;font-size:.8125rem;font-weight:500;color:var(--fg);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Hero */
.hero{padding-block:3rem 1.75rem}
.hero h1{font-size:clamp(2.25rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:0;text-wrap:balance}
.hero p{color:var(--fg-2);font-size:clamp(1.0625rem,1.6vw,1.3125rem);margin:.75rem 0 0;max-width:40rem;text-wrap:pretty}

.grid{display:grid;grid-template-columns:minmax(0,25rem) minmax(0,1fr);gap:1.5rem;align-items:start;padding-bottom:4rem}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.brief{padding:1.25rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.25rem);max-height:calc(100vh - 5.5rem);overflow:auto}
@media (max-width:980px){.brief{position:static;max-height:none}}
.brief h2{font-size:1.25rem;letter-spacing:-.02em;margin:0 0 1rem;font-weight:600}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field label,.lbl{font-size:.8125rem;font-weight:500;color:var(--fg-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
input[type=text],select,textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);padding:.6rem .75rem;font-size:.9375rem;outline:none;transition:border-color .15s,background .15s}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:4.2rem;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.35rem .8rem;font-size:.8125rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.5rem}
.step span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:var(--r-sm);padding:.35rem .4rem .35rem .7rem}
.step span{font-size:.875rem;display:flex;align-items:center;gap:.4rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block;flex:none}
.step .ctl{display:flex;align-items:center;gap:.15rem}
.step button{width:1.75rem;height:1.75rem;border-radius:50%;border:0;background:var(--surface);font-size:1rem;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.step output{min-width:1.4rem;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.total{font-size:.8125rem;color:var(--fg-2);margin:.5rem 0 0}
.more{margin:.25rem 0 .9rem;border:0;background:none;color:var(--accent);font-size:.875rem;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:999px;padding:.7rem 1.3rem;font-size:.9375rem;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);width:100%;padding:.85rem 1rem;font-size:1rem}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.link{background:none;color:var(--accent);padding:.4rem .2rem}
.note{font-size:.8125rem;color:var(--fg-2);margin:.7rem 0 0;text-align:center}
.note.err{color:var(--danger)}

/* Briefing sections */
.sec-t{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);margin:1.25rem 0 .75rem;padding-top:1rem;border-top:1px solid var(--line)}
.hint{font-size:.8125rem;color:var(--fg-2);margin:-.35rem 0 .9rem;line-height:1.4;display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}
.hint b{color:var(--fg);font-weight:500}
.hint button{flex:none;border:0;background:none;color:var(--accent);font-size:.8125rem;padding:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:.2rem;text-align:center;border:1.5px dashed var(--fg-2);border-radius:var(--r-md);padding:1rem .9rem;cursor:pointer;transition:border-color .15s,background .15s;opacity:.95}
.drop b{font-size:.9375rem;font-weight:600;color:var(--accent)}
.drop span{font-size:.8125rem;color:var(--fg-2);line-height:1.35}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.45rem;margin-top:.5rem}
.file{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;padding:.3rem;text-align:center}
.file img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.file .ext{font-size:.75rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.file .fn{font-size:.625rem;color:var(--fg-2);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.file .rm{position:absolute;top:.2rem;right:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;border:0;background:var(--scrim-ink);color:#fff;font-size:.7rem;line-height:1;z-index:1}
.chips.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.chips.wk .chip{padding:.4rem 0;text-align:center}
.mini-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.2rem;background:var(--surface-2);border-radius:var(--r-md);padding:.5rem}
.mini-cal .dw{font-size:.625rem;text-align:center;color:var(--fg-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-bottom:.15rem}
.md{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:transparent;font-size:.8125rem;font-variant-numeric:tabular-nums;padding:0}
.md[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.md.hol::after{content:"";position:absolute;left:50%;bottom:12%;width:.25rem;height:.25rem;margin-left:-.125rem;border-radius:50%;background:var(--c-est)}
.cal-act{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.35rem}
.cal-act .total{margin:0}
.total.warn{color:var(--c-est)}
.total .fix{border:0;background:none;color:var(--accent);padding:0;font-size:.8125rem;margin-left:.3rem}
.tagin{display:flex;gap:.4rem}
.tagin input{flex:1;min-width:0}
.tagin .btn{padding:.55rem .9rem;font-size:.875rem}
#temas:not(:empty){margin-top:.5rem}
.tchip{display:inline-flex;align-items:center;gap:.35rem;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:.3rem .45rem .3rem .75rem;font-size:.8125rem;font-weight:500}
.tchip i{font-style:normal;width:1.1rem;height:1.1rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;background:var(--accent);color:var(--on-accent)}

/* Client profile + post description */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:.9rem 1.5rem;margin-top:.2rem}
.fact h4{margin:0 0 .25rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.fact p{margin:0;font-size:.9375rem;line-height:1.45}
.fact ul{margin:0;padding-left:1.1rem;font-size:.9375rem;line-height:1.45}
.desc{font-size:1rem;line-height:1.55;margin:0;max-width:40rem;text-wrap:pretty}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.check li{display:grid;grid-template-columns:1.1rem minmax(0,1fr);gap:.55rem;font-size:.9375rem;line-height:1.4}
.check li::before{content:"";width:.95rem;height:.95rem;margin-top:.15rem;border-radius:.3rem;border:1.5px solid var(--fg-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:.75rem}
.kv div{background:var(--surface-2);border-radius:var(--r-sm);padding:.7rem .85rem}
.kv b{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);margin-bottom:.2rem}
.kv span{font-size:.9375rem;line-height:1.4}
.temas-meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.9rem}

/* Result */
.result{display:flex;flex-direction:column;gap:1.25rem;min-width:0}
.head{padding:1.5rem 1.5rem 1.25rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between}
.head .t{min-width:0}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--accent);margin:0 0 .3rem;display:flex;gap:.5rem;align-items:center}
.tag{font-size:.6875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--fg-2);border-radius:999px;padding:.15rem .5rem}
.head h2{font-size:clamp(1.75rem,3.2vw,2.5rem);letter-spacing:-.03em;line-height:1.08;margin:0;font-weight:700;text-wrap:balance}
.head .sub{color:var(--fg-2);margin:.35rem 0 0}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.counts{display:flex;flex-wrap:wrap;gap:1.5rem;padding:0 1.5rem 1.4rem}
.count b{display:block;font-size:1.75rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:.8125rem;color:var(--fg-2);display:flex;align-items:center;gap:.35rem}

.card{padding:1.4rem 1.5rem}
.card h3{font-size:1.25rem;letter-spacing:-.02em;margin:0 0 .25rem;font-weight:600}
.card .lead{color:var(--fg-2);margin:0 0 1.1rem;max-width:44rem}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.75rem}
.pillar{border:1px solid var(--line);border-radius:var(--r-md);padding:.9rem 1rem;text-align:left;background:transparent;display:flex;flex-direction:column;gap:.35rem}
.pillar[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pillar .pt{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-weight:600}
.pillar .pct{font-variant-numeric:tabular-nums;color:var(--fg-2);font-weight:500;font-size:.875rem}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pillar p{margin:0;font-size:.875rem;color:var(--fg-2);line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin-top:1rem;font-size:.875rem;color:var(--fg-2)}
.meta b{color:var(--fg);font-weight:500}

/* Calendar */
.cal-legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8125rem;color:var(--fg-2);margin-bottom:.9rem}
.cal-legend span{display:flex;align-items:center;gap:.35rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem}
.dow{font-size:.75rem;font-weight:600;color:var(--fg-2);text-align:center;padding-bottom:.25rem;text-transform:uppercase;letter-spacing:.04em}
.day{min-height:5.5rem;border-radius:var(--r-sm);background:var(--surface-2);padding:.4rem;display:flex;flex-direction:column;gap:.25rem;min-width:0;border:0;text-align:left}
.day.empty{background:transparent}
.day .n{font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums}
.day .hol{font-size:.6875rem;color:var(--accent);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{border:0;border-radius:.4rem;padding:.2rem .35rem;font-size:.6875rem;font-weight:600;text-align:left;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.pill.Carrossel{background:var(--c-car)} .pill.Reels{background:var(--c-reel)} .pill.Estático{background:var(--c-est)} .pill.Stories{background:var(--c-sto)}
:root[data-theme="dark"] .pill{color:#000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#000}}
@media (max-width:640px){.day{min-height:3.6rem;padding:.3rem}.pill{font-size:0;height:.45rem;padding:0;border-radius:3px}.day .hol{display:none}.cal{gap:.25rem}}

/* Posts */
.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:.75rem}
.post{border:1px solid var(--line);border-radius:var(--r-md);padding:1rem;text-align:left;background:transparent;display:flex;flex-direction:column;gap:.45rem;min-width:0;transition:border-color .15s,transform .15s}
.post:hover{border-color:var(--fg-2)}
.post .pm{display:flex;align-items:center;gap:.45rem;font-size:.8125rem;color:var(--fg-2);font-variant-numeric:tabular-nums}
.post h4{margin:0;font-size:1.0625rem;letter-spacing:-.015em;font-weight:600;line-height:1.3}
.post p{margin:0;font-size:.875rem;color:var(--fg-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .pending{font-style:italic}
.empty-state{padding:3rem 1.5rem;text-align:center;color:var(--fg-2)}
.empty-state h3{color:var(--fg);font-size:1.25rem;margin:0 0 .4rem}

/* Progress */
.progress{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.6rem}
.progress .pl{display:flex;justify-content:space-between;font-size:.9375rem;font-weight:500}
.progress .pl span{color:var(--fg-2);font-weight:400;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .4s ease}

/* Saved list */
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:.75rem;padding-bottom:4rem}
.sv{padding:1.2rem;text-align:left;border:0;display:flex;flex-direction:column;gap:.3rem}
.sv .m{font-size:.8125rem;color:var(--fg-2)}
.sv h3{margin:0;font-size:1.1875rem;letter-spacing:-.02em}
.sv .mini{display:flex;gap:.3rem;margin-top:.4rem;flex-wrap:wrap}
.sv .mini .dot{width:.55rem;height:.55rem}
.acessos{margin-bottom:4rem}
#viewSalvas .saved{padding-bottom:1.25rem}
.ac{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.5rem 1rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line)}
.ac:first-of-type{border-top:0}
.ac .nm{min-width:0}
.ac .nm b{display:block}
.ac .nm span{font-size:.8125rem;color:var(--fg-2)}
.ac code{font-family:var(--mono);font-size:.9375rem;letter-spacing:.06em;background:var(--surface-2);border-radius:var(--r-sm);padding:.35rem .6rem}
.ac .bt{display:flex;gap:.4rem;flex-wrap:wrap}
.ac .btn{padding:.4rem .8rem;font-size:.8125rem}
@media (max-width:640px){.ac{grid-template-columns:minmax(0,1fr) auto}.ac .bt{grid-column:1/-1}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:var(--r-lg);width:min(46rem,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sh-top{position:sticky;top:0;background:var(--surface);padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--line);display:flex;gap:.75rem;align-items:flex-start;z-index:1}
.sh-top .t{flex:1;min-width:0}
.sh-top h3{margin:.15rem 0 0;font-size:1.375rem;letter-spacing:-.025em;line-height:1.2}
.x{border:0;background:var(--surface-2);width:2rem;height:2rem;border-radius:50%;font-size:1rem;flex:none}
.sh-body{padding:1.1rem 1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.25rem}
.sec h5{margin:0 0 .5rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center}
.sec h5 button{text-transform:none;letter-spacing:0;font-size:.8125rem;font-weight:500;border:0;background:none;color:var(--accent);padding:0}
.hook{background:var(--surface-2);border-radius:var(--r-sm);padding:.7rem .85rem;margin-bottom:.4rem;font-weight:500}
.slides{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.35rem;scroll-snap-type:x mandatory}
.slide{flex:0 0 min(15rem,78%);aspect-ratio:4/5;max-width:100%;background:var(--surface-2);border-radius:var(--r-md);padding:1rem;scroll-snap-align:start;display:flex;flex-direction:column;gap:.5rem;overflow:auto}
.slide .sn{font-size:.75rem;color:var(--fg-2);font-variant-numeric:tabular-nums}

 if(!feedTotal())FEED.forEach((f,i)=>w[i]=1/3);
 const raw=w.map(x=>x*n),base=raw.map(Math.floor);let left=n-base.reduce((a,b)=>a+b,0);
 raw.map((x,i)=>[x-base[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){base[i]++;left--}});

 if(form.freq==="intervalo"){form.inicio=Math.min(form.inicio,n);for(let d=form.inicio;d<=n;d+=form.intervalo)form.datas.add(d);return}

function feriados(m,y){const f={0:{1:"Ano Novo"},1:{},2:{8:"Dia da Mulher",15:"Dia do Consumidor"},3:{21:"Tiradentes"},4:{1:"Dia do Trabalho"},5:{12:"Dia dos Namorados"},6:{},7:{},8:{7:"Independência",15:"Dia do Cliente"},9:{12:"Dia das Crianças",31:"Halloween"},10:{2:"Finados",15:"Proclamação da República",20:"Consciência Negra"},11:{24:"Véspera de Natal",25:"Natal",31:"Réveillon"}}[m]||{};
 const r={...f};const nth=(wd,k)=>{let c=0;for(let d=1;d<=daysIn(m,y);d++)if(dow(d,m,y)===wd&&++c===k)return d};

async function addFiles(list){
 for(const f of [...list]){
  const id=Math.random().toString(36).slice(2);
  if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){const a={id,name:f.name,kind:"pdf",blob:f,texto:"",paginas:[],lendo:true};anexos.push(a);paintFiles();readPdf(a)}
  else if(/^image\//.test(f.type)){
   if(!imgLimits){toast("Prints só funcionam com a página aberta no Claude");continue}
   if(!imgLimits.mediaTypes.includes(f.type)){toast("Use JPG, PNG, WebP ou GIF");continue}
   if(f.size>imgLimits.maxInputBytes){toast("Imagem grande demais");continue}
   anexos.push({id,name:f.name,kind:"img",blob:f,url:URL.createObjectURL(f)})}
  else toast("Envie imagens ou PDF")}
 paintFiles()}
function paintFiles(){const box=$("#files");box.hidden=!anexos.length;

 box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const a=anexos.find(x=>x.id===b.dataset.rm);if(a&&a.url)URL.revokeObjectURL(a.url);anexos=anexos.filter(x=>x!==a);paintFiles()});

let pdfLib=null;
function loadPdfJs(){if(pdfLib)return pdfLib;pdfLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)}catch(e){rej(e)}};s.onerror=()=>{pdfLib=null;rej(new Error("pdfjs"))};document.head.appendChild(s)});return pdfLib}
async function readPdf(a){
 try{const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await a.blob.arrayBuffer())}).promise;
  const n=Math.min(doc.numPages,20);let txt="";
  for(let i=1;i<=n;i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();txt+=c.items.map(x=>x.str).join(" ")+"\n"}
  a.texto=txt.replace(/[ \t]+/g," ").trim().slice(0,18000);
  /* Scanned or image-heavy PDF: send the first pages as pictures */
  if(a.texto.length<300&&imgLimits){for(let i=1;i<=Math.min(doc.numPages,4);i++){const pg=await doc.getPage(i);const v=pg.getViewport({scale:1});const sc=Math.min(2,1400/Math.max(v.width,v.height));const vp=pg.getViewport({scale:sc});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;const bl=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));if(bl)a.paginas.push(bl)}}
  if(!a.texto&&!a.paginas.length)toast("Não consegui ler esse PDF. Descreva por escrito.")}
 catch(e){toast("Não consegui abrir esse PDF")}
 a.lendo=false;paintFiles()}

  body+=`<div class="sec"><h5>Legenda <button type="button" data-copy="legenda">Copiar</button></h5><div class="caption">${esc(x.legenda)}${x.hashtags&&x.hashtags.length?"\n\n"+esc(x.hashtags.join(" ")):""}</div></div>`;

/* ---------- Text export ---------- */
function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function postMd(x,p){let s=`## ${x.dia}/${p.mes+1} (${DIAS[dow(x.dia,p.mes,p.ano)]}) · ${x.formato} · ${x.pilar}\n### ${x.titulo||x.tema}\nObjetivo: ${x.objetivo}\n${x.descricao?"\nDescrição: "+x.descricao+"\n":""}${x.horario?"Quando postar: "+x.horario+"\n":""}${x.metrica?"O que medir: "+x.metrica+"\n":""}${(x.producao||[]).length?"\nComo produzir:\n"+x.producao.map(t=>"- [ ] "+t).join("\n")+"\n":""}${x.visual?"\nDireção visual: "+x.visual+"\n":""}\nGanchos:\n${(x.ganchos||[]).map(g=>"- "+g).join("\n")}\n`;
 if(x.slides)s+=`\nSlides:\n${x.slides.map((t,j)=>`${j+1}. ${t.titulo} — ${t.texto}`).join("\n")}\n`;
 if(x.roteiro)s+=`\nRoteiro:\n${x.roteiro.map(r=>`- [${r.tempo}] ${r.fala} (Cena: ${r.cena}${r.texto_tela?"; Na tela: "+r.texto_tela:""})`).join("\n")}\n`;
 if(x.arte)s+=`\nArte: "${x.arte.frase}" — ${x.arte.direcao}\n`;
 if(x.telas)s+=`\nTelas:\n${x.telas.map((t,j)=>`${j+1}. ${t.texto}${t.recurso?" ("+t.recurso+")":""}`).join("\n")}\n`;
 if(x.legenda)s+=`\nLegenda:\n${x.legenda}\n\nCTA: ${x.cta}\nHashtags: ${(x.hashtags||[]).join(" ")}\n`;return s}
function toMarkdown(p){const e=p.estrategia||{};let s=`# Pauta ${p.cliente} · ${MESES[p.mes]} ${p.ano}\n${p.arroba||""}${p.nicho?" · "+p.nicho:""}\nObjetivo: ${p.objetivo}\n${p.perfil&&p.perfil.resumo?"\n## Sobre o cliente\n"+p.perfil.resumo+"\n":""}${p.briefing&&(p.briefing.temas||[]).length?"\nTemas: "+p.briefing.temas.join("; ")+"\n":""}\n## Estratégia\n${e.resumo||""}\n\nPilares:\n${(e.pilares||[]).map(x=>`- ${x.nome} (${x.pct}%): ${x.descricao}`).join("\n")}\n\nFrequência: ${e.frequencia||""}\n`;
 if((e.datas||[]).length)s+=`\nDatas:\n${e.datas.map(d=>`- ${d.dia}/${p.mes+1} ${d.nome}: ${d.uso}`).join("\n")}\n`;
 s+=`\n## Calendário\n| Data | Dia | Formato | Pilar | Tema |\n|---|---|---|---|---|\n${sorted(p).map(x=>`| ${x.dia}/${p.mes+1} | ${DIAS[dow(x.dia,p.mes,p.ano)]} | ${x.formato} | ${x.pilar} | ${x.tema} |`).join("\n")}\n\n# Posts\n\n`;
 return s+sorted(p).map(x=>postMd(x,p)).join("\n---\n\n")}

/* ---------- Generation ---------- */
function perfilTexto(pf){if(!pf)return"";const L=(k,v)=>v&&(Array.isArray(v)?v.length:true)?`${k}: ${Array.isArray(v)?v.join("; "):v}\n`:"";
 return `PERFIL DO CLIENTE (lido do material enviado)\n`+L("O que faz",pf.resumo)+L("Produtos e serviços",pf.produtos)+L("Público",pf.publico)+L("Tom de voz",pf.tom)+L("Diferenciais",pf.diferenciais)+L("Identidade visual",pf.visual)+L("Oportunidades de conteúdo",pf.oportunidades)+L("Cuidados",pf.cuidados)}
function briefingText(b){return `Cliente: ${b.cliente}${b.arroba?" ("+b.arroba+")":""}
Nicho: ${b.nicho||"não informado"}
Mês: ${MESES[b.mes]} de ${b.ano}
Objetivo do mês: ${b.objetivo}
Temas que a social media quer abordar: ${b.temas&&b.temas.length?b.temas.join("; "):"livre"}
Produtos/promoções/eventos: ${b.destaques||"nenhum informado"}
Tom de voz: ${b.tom||"adequado ao nicho"}
Público: ${b.publico||"não informado"}
Evitar: ${b.evitar||"nada específico"}
${b.perfil?"\n"+perfilTexto(b.perfil):b.sobre?"\nSobre o cliente: "+b.sobre+"\n":""}${pastaTexto(b.cliente)}`}
function calendarioTexto(m,y){const n=daysIn(m,y);let a=[];for(let d=1;d<=n;d++)a.push(`${d} ${DIAS[dow(d,m,y)]}`);return a.join(", ")}
const REGRAS=`Você é estrategista de conteúdo de Instagram da agência @isadsign.co. Escreva em português do Brasil, na linguagem do público do cliente. Use o que você sabe do cliente (produtos, diferenciais, público, visual) em cada ideia: nada genérico que serviria a qualquer perfil. Ganchos variados (pergunta, erro comum, número, polêmica leve, antes/depois). No máximo 1 em cada 4 posts é venda direta. Responda SOMENTE com JSON válido, sem texto antes ou depois.`;

/* 1. Read prints, PDFs and the written description into a reusable client profile */
async function lerCliente(b,imgs,pdfTexto){
 const prompt=`Você é estrategista de conteúdo da agência @isadsign.co e vai montar o perfil de um cliente para planejar o Instagram dele.

${b.sobre?"Descrição escrita pela social media:\n"+b.sobre+"\n":""}${pdfTexto?"\nTexto extraído dos PDFs do cliente:\n"+pdfTexto+"\n":""}${imgs.length?`\nAs ${imgs.length} imagens anexas são prints do perfil, fotos ou páginas de material do cliente. Observe produtos, preços, linguagem das legendas, paleta, tipografia, tipo de foto e o que mais engaja.`:""}
${perfilSalvo()&&perfilSalvo().perfil?"\nPerfil anterior (atualize com o material novo, mantenha o que continua válido):\n"+JSON.stringify(perfilSalvo().perfil)+"\n":""}
Responda SOMENTE com JSON:
{"resumo":"2 a 3 frases: o que o negócio faz, onde e para quem","produtos":["produtos ou serviços principais, com preço se aparecer"],"publico":"quem compra e o que essa pessoa quer","tom":"como o cliente fala (palavras, emojis, formalidade)","diferenciais":["o que diferencia dos concorrentes"],"visual":"paleta, tipografia e estilo de foto que aparecem no material","oportunidades":["4 a 6 assuntos de conteúdo que o material sugere"],"cuidados":"o que evitar (promessas, termos proibidos, concorrentes) ou string vazia"}
Use só o que o material mostra ou indica com clareza; quando não houver informação, deixe o campo curto em vez de inventar.`;
 const opts={modelTier:"default"};if(imgs.length)opts.images=imgs;
 const r=await sample.json(prompt,opts);
 const S=v=>String(v||"").trim(),A=v=>(Array.isArray(v)?v:[]).map(S).filter(Boolean);
 return {resumo:S(r.resumo),produtos:A(r.produtos),publico:S(r.publico),tom:S(r.tom),diferenciais:A(r.diferenciais),visual:S(r.visual),oportunidades:A(r.oportunidades),cuidados:S(r.cuidados)}}

/* 2. Plan the month on the chosen dates */
async function planPauta(b){
 const mixTxt=FORMATOS.filter(f=>b.mix[f]).map(f=>`${b.mix[f]} ${f}`).join(", ");
 const datas=(b.datas||[]).slice().sort((x,y)=>x-y);
 const regraDatas=datas.length?`- DATAS FIXAS DO FEED (Carrossel, Reels e Estático): use EXATAMENTE estes dias, um post de feed por dia: ${datas.map(d=>`${d} (${DIAS[dow(d,b.mes,b.ano)]})`).join(", ")}. Não use outros dias para o feed. Stories podem cair em qualquer dia.`:`- Distribua os posts no mês: não repita o mesmo formato em dois dias seguidos, espalhe pelas semanas. Stories podem cair no mesmo dia de um post de feed.`;
 const prompt=`${REGRAS}

BRIEFING
${briefingText(b)}
CALENDÁRIO REAL DE ${MESES[b.mes].toUpperCase()} ${b.ano} (dia e dia da semana):
${calendarioTexto(b.mes,b.ano)}

TAREFA: planeje a pauta do mês com EXATAMENTE estes posts: ${mixTxt}.
${regraDatas}
- Frequência combinada: ${b.freq==="intervalo"?`feed ${freqIntervaloTxt(b).toLowerCase()}`:b.semana&&b.semana.length?`${b.semana.length}x por semana no feed (${b.semana.map(i=>DIAS[i]).join(", ")})`:"definida pelas datas acima"}.
${b.temas&&b.temas.length?`- Cada tema pedido precisa aparecer em pelo menos um post: ${b.temas.join("; ")}. Complete com outros temas coerentes com o cliente.`:"- Escolha temas a partir do perfil e das oportunidades do cliente."}
- Escolha de 3 a 4 pilares de conteúdo com porcentagens que somam 100.
- Liste só datas comemorativas realmente relevantes para este nicho neste mês, com o dia correto, e aproveite as que caírem em dias de post.
- Alterne formatos de modo que o mesmo formato não apareça em dias de feed seguidos quando der.

Formato do JSON:
{"resumo":"2 frases com a estratégia do mês","frequencia":"frase curta com dias e horários sugeridos","pilares":[{"nome":"","pct":0,"descricao":"1 frase"}],"datas":[{"dia":0,"nome":"","uso":"como usar no conteúdo"}],"posts":[{"dia":0,"formato":"Carrossel|Reels|Estático|Stories","pilar":"nome de um pilar","tema":"tema específico em até 10 palavras","objetivo":"1 frase"}]}`;
 return sample.json(prompt,{modelTier:"default"});
}

 "descricao":"descrição completa do conteúdo em 4 a 6 frases: do que se trata, a ideia central, por que funciona para este público e este objetivo, como ele conversa com o produto ou serviço do cliente e qual resultado esperar",
 "producao":["4 a 6 itens do que preparar para produzir: fotos ou cenas a captar, produtos a separar, elementos de arte, aprovações"],
 "visual":"direção visual: cores, tipografia, enquadramento e estilo de imagem coerentes com a identidade do cliente",
 "horario":"melhor dia e horário para publicar e por quê, em 1 frase",

Omita os campos slides, roteiro, arte e telas que não são do formato do post.`}
async function detailBatch(p,batch,extra){
 const ctx=`Estratégia: ${p.estrategia.resumo} Pilares: ${p.estrategia.pilares.map(x=>x.nome).join(", ")}.`;
 const lista=batch.map(x=>`- id ${x.id} · dia ${x.dia} (${DIAS[dow(x.dia,p.mes,p.ano)]}) · ${x.formato} · pilar ${x.pilar} · tema: ${x.tema} · objetivo: ${x.objetivo}`).join("\n");
 const prompt=`${REGRAS}

BRIEFING
${briefingText(p.briefing)}
${ctx}

POSTS PARA ESCREVER COMPLETOS:
${lista}
${extra?"\nPEDIDO DE AJUSTE: "+extra+"\n":""}
${detailSpec()}

Responda com {"posts":[ ... ]} na mesma ordem e com os mesmos ids.`;
 const opts={modelTier:"default"};if(extra)opts.cache=false;
 const r=await sample.json(prompt,opts);
 return (r&&r.posts)||[];
}
const DETAIL_KEYS=["titulo","descricao","producao","visual","horario","metrica","ganchos","slides","roteiro","arte","telas","legenda","cta","hashtags"];
function mergeDetail(p,d){const x=p.posts.find(y=>y.id===d.id);if(!x)return;DETAIL_KEYS.forEach(k=>{if(d[k]!=null)x[k]=d[k]});
 if(x.formato!=="Carrossel")delete x.slides;if(x.formato!=="Reels")delete x.roteiro;if(x.formato!=="Estático")delete x.arte;if(x.formato!=="Stories")delete x.telas}
function sanitizePlan(plan,b){
 const n=daysIn(b.mes,b.ano);let posts=(plan.posts||[]).filter(x=>FORMATOS.includes(x.formato));
 const out=[];FORMATOS.forEach(f=>{let have=posts.filter(x=>x.formato===f).slice(0,b.mix[f]);
  while(have.length<b.mix[f])have.push({dia:0,formato:f,pilar:(plan.pilares&&plan.pilares[0]||{}).nome||"Geral",tema:(b.temas||[])[have.length%Math.max(1,(b.temas||[]).length)]||"Tema livre",objetivo:"Engajar o público."});out.push(...have)});
 out.forEach((x,i)=>{let d=parseInt(x.dia,10);if(!(d>=1&&d<=n))d=Math.max(1,Math.round((i+.5)*n/out.length));x.dia=d;x.id="p"+(i+1)});
 /* Keep feed posts on the chosen dates: one per date, moving strays to free dates in order */
 const datas=(b.datas||[]).slice().sort((x,y)=>x-y);
 if(datas.length){const feed=out.filter(x=>FEED.includes(x.formato)).sort((a,c)=>a.dia-c.dia);const used=new Set(),strays=[];
  feed.forEach(x=>{if(datas.includes(x.dia)&&!used.has(x.dia))used.add(x.dia);else strays.push(x)});
  const livres=datas.filter(d=>!used.has(d));
  strays.forEach(x=>{if(livres.length){let k=0,best=1e9;livres.forEach((d,j)=>{const dist=Math.abs(d-x.dia);if(dist<best){best=dist;k=j}});x.dia=livres.splice(k,1)[0]}else{x.dia=datas[(strays.indexOf(x))%datas.length]}})}
 const pil=(plan.pilares||[]).map(x=>({nome:String(x.nome||""),pct:Math.round(+x.pct||0),descricao:String(x.descricao||"")})).filter(x=>x.nome);
 const datasC=(plan.datas||[]).map(d=>({dia:parseInt(d.dia,10),nome:String(d.nome||""),uso:String(d.uso||"")})).filter(d=>d.dia>=1&&d.dia<=n&&d.nome);
 return {estrategia:{resumo:String(plan.resumo||""),frequencia:String(plan.frequencia||""),pilares:pil,datas:datasC},posts:out}}

$("#form").addEventListener("submit",async e=>{
 e.preventDefault();if(busy||!sample)return;
 const b=readForm();if(!b.cliente){$("#fCliente").focus();setNote("Informe o nome do cliente.",true);return}
 if(!totalPosts())return;
 if(anexos.some(a=>a.lendo)){setNote("Espere terminar de ler o PDF.",true);return}
 busy=true;updateTotal();$("#genBtn").textContent="Gerando…";filtroFormato="Todos";filtroPilar=null;
 current={id:"pauta-"+Date.now().toString(36),cliente:b.cliente,arroba:b.arroba,nicho:b.nicho,mes:b.mes,ano:b.ano,objetivo:b.objetivo,briefing:b,estrategia:null,posts:[],criadoEm:new Date().toISOString()};
 if(window.innerWidth<=980)$("#result").scrollIntoView({behavior:"smooth",block:"start"});
 try{
  /* Client material: new files or text update the saved profile; otherwise reuse it */
  const max=maxImgs();let imgs=[];anexos.forEach(a=>{if(a.kind==="img")imgs.push(a.blob);else imgs.push(...a.paginas)});
  if(imgs.length>max){imgs=imgs.slice(0,max);toast(`Usei as ${max} primeiras imagens`)}
  const pdfTexto=anexos.filter(a=>a.kind==="pdf"&&a.texto).map(a=>`[${a.name}]\n${a.texto}`).join("\n\n").slice(0,30000);
  const salvo=perfilSalvo();
  const novoMaterial=imgs.length||pdfTexto||(b.sobre&&(!salvo||salvo.sobre!==b.sobre));
  if(novoMaterial){setNote("Lendo o material do cliente…");renderResult({label:"Lendo prints, PDF e descrição do cliente",pct:.03});
   b.perfil=await lerCliente(b,imgs,pdfTexto);await saveCliente(b)}
  else if(salvo&&salvo.perfil)b.perfil=salvo.perfil;
  current.briefing=b;current.perfil=b.perfil||null;
  setNote("Planejando o mês…");renderResult({label:"Planejando estratégia e calendário",pct:.1});
  const plan=await planPauta(b);const s=sanitizePlan(plan,b);current.estrategia=s.estrategia;current.posts=s.posts;
  const order=sorted(current),size=2,batches=[];for(let i=0;i<order.length;i+=size)batches.push(order.slice(i,i+size));
  let done=0;const total=order.length;
  const tick=()=>renderResult({label:"Escrevendo os posts",detail:`${done} de ${total}`,pct:.2+.8*done/total});
  tick();await savePauta(current);setNote("Escrevendo os posts…");
  let idx=0;
  async function worker(){while(idx<batches.length){const bt=batches[idx++];try{const ds=await detailBatch(current,bt);ds.forEach(d=>mergeDetail(current,d))}catch(err){if(err&&(err.code==="not_granted"||err.code==="rate_limited"))throw err}done+=bt.length;tick();if(openId)renderSheet()}}
  await Promise.all([worker(),worker()]);
  const missing=current.posts.filter(x=>!detailed(x)).length;
  await savePauta(current);
  setNote(missing?`${missing} ${missing===1?"post ficou":"posts ficaram"} sem conteúdo. Abra e use Refazer post.`:"Pauta pronta e salva.",!!missing);
  if(!missing){anexos.forEach(a=>a.url&&URL.revokeObjectURL(a.url));anexos=[];paintFiles()}
 }catch(err){setNote(errMsg(err),true);if(!current.estrategia){current=saved[0]||EXEMPLO}else{await savePauta(current)}}
 busy=false;$("#genBtn").textContent="Gerar pauta";updateTotal();renderResult();if(openId)renderSheet();
});

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normCod=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function novoCodigo(){const s=[...crypto.getRandomValues(new Uint8Array(8))].map(n=>ALFABETO[n%ALFABETO.length]).join("");return s.slice(0,4)+"-"+s.slice(4)}
function novoToken(id){return `${id}-${[...crypto.getRandomValues(new Uint8Array(6))].map(n=>(n%36).toString(36)).join("")}`}
async function chave(codigo,salt,uso){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(normCod(codigo)),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,[uso])}
async function trancar(cliente,codigo,pautas){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const data=await crypto.subtle.encrypt({name:"AES-GCM",iv},await chave(codigo,salt,"encrypt"),new TextEncoder().encode(JSON.stringify({pautas})));
 return {v:1,cliente,iter:ITER,salt:b64(salt),iv:b64(iv),data:b64(data)}}
async function abrir(a,codigo){const salt=ub(a.salt);const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(normCod(codigo)),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:a.iter||ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(a.iv)},key,ub(a.data))))}
/* What the client sees: internal briefing notes stay out */
function limpar(p){const {exemplo,briefing,criadoEm,atualizadoEm,...resto}=JSON.parse(JSON.stringify(p));return {...resto,briefing:{temas:(briefing&&briefing.temas)||[]}}}

async function liberar(p,btn){
 portalSync=true;btn.disabled=true;btn.textContent="Liberando…";
 try{
  const id=slugC(p.cliente),prev=acessos.find(a=>a.id===id);
  const a=prev?{cliente:prev.cliente,token:prev.token,codigo:prev.codigo}:{cliente:p.cliente,token:novoToken(id),codigo:novoCodigo()};
  let lista=[];if(prev&&prev.payload){try{lista=(await abrir(prev.payload,prev.codigo)).pautas||[]}catch(e){lista=[]}}
  lista=lista.filter(x=>!(x.mes===p.mes&&x.ano===p.ano));lista.push(limpar(p));lista.sort((x,y)=>(y.ano-x.ano)||(y.mes-x.mes));
  a.payload=await trancar(a.cliente,a.codigo,lista);a.meses=lista.map(x=>`${MESES[x.mes]} ${x.ano}`);a.url=`${APP_URL}#${a.token}`;a.atualizadoEm=new Date().toISOString();
  await db.collection("acessos").doc(id).set(a);
  if(p.status!=="aprovada"){p.status="liberada";p.statusEm=new Date().toISOString();await savePauta(p)}
  voltarDepois({view:"clientes",pasta:id,msg:`Pauta liberada para ${a.cliente}`});
  await publishPortal({...PORTAL,[a.token]:a.payload});
 }catch(err){const c=err&&err.code;if(c==="conflict")return;
  toast(erroPublicar(c));
  btn.disabled=false;btn.textContent="Liberar para o cliente"}}
/* Rebuild this page from its own source with the new portal block and publish it as the next version */
async function publishPortal(data){
 portalSync=true;
 if(cfg.whatsapp)data={...data,_cfg:{whatsapp:cfg.whatsapp}};
 const json=JSON.stringify(data).replace(/</g,"\\u003c");
 const html=`<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body><title>Pauta isadsign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">${$("#css").textContent}</style>

<template id="markup">${MARKUP.innerHTML}</template>
<script type="application/json" id="portal">${json}<\/script>
<script id="src">${document.getElementById("src").textContent}<\/script>
</body></html>`;
 await artifactCap.publish(html)}
/* After Claude republishes the page from the repo the portal block can come back empty: put back what acessos holds. Only adds or updates, never removes. */
function sincronizarPortal(){
 if(portalSync||!dono||!artifactCap||busy||!acessosOk||!cfgOk)return;
 const novo={...PORTAL};let muda=false;
 if(cfg.whatsapp&&(!PORTAL._cfg||PORTAL._cfg.whatsapp!==cfg.whatsapp)){novo._cfg={whatsapp:cfg.whatsapp};muda=true}
 /* Compare the ciphertext itself: the database may return the payload's keys in another order */
 acessos.forEach(a=>{const cur=PORTAL[a.token];if(a.token&&a.payload&&a.payload.data&&(!cur||cur.data!==a.payload.data||cur.iv!==a.payload.iv)){novo[a.token]=a.payload;muda=true}});
 if(!muda)return;portalSync=true;publishPortal(novo).catch(()=>{})}

/* Client view */
const LSC="pauta-codigo-"+TOKEN;
const lsGet=()=>{try{return localStorage.getItem(LSC)}catch(e){return null}};
const lsSet=v=>{try{v?localStorage.setItem(LSC,v):localStorage.removeItem(LSC)}catch(e){}};
function startCliente(){
 document.body.classList.add("cliente");
 const a=PORTAL[TOKEN];
 if(!a){$("#result").innerHTML=`<section class="panel gate"><p class="eyebrow">Pauta isadsign</p><h2>Link não encontrado</h2><p>Confira se você abriu o link inteiro que a isadsign enviou.</p></section>`;return}
 const salvo=lsGet();if(!salvo)return gateCliente();
 abrir(a,salvo).then(d=>entrarCliente(d),()=>{lsSet(null);gateCliente()})}
function gateCliente(err){
 $("#sairBtn").hidden=true;
 $("#result").innerHTML=`<section class="panel gate"><p class="eyebrow">Sua pauta de conteúdo</p><h2>${esc(PORTAL[TOKEN].cliente)}</h2><p>Digite o código de acesso que a isadsign enviou para você.</p>
 <form id="gateForm" autocomplete="off"><label for="codigo" class="lbl">Código de acesso</label><input type="text" id="codigo" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12" required>
 <label class="remember"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
 ${err?`<p class="note err" role="alert">${esc(err)}</p>`:""}<button type="submit" class="btn primary" id="entrarBtn">Ver minha pauta</button></form></section>`;
 const inp=$("#codigo");
 inp.addEventListener("input",()=>{const v=normCod(inp.value).slice(0,8);inp.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v});
 $("#gateForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("#entrarBtn");b.disabled=true;b.textContent="Abrindo…";
  let d;try{d=await abrir(PORTAL[TOKEN],inp.value)}
  catch(_){gateCliente("Código incorreto. Confira as letras e os números e tente de novo.");$("#codigo").focus();return}
  if($("#lembrar").checked)lsSet(normCod(inp.value));entrarCliente(d)});
 setTimeout(()=>inp.focus(),50)}
function entrarCliente(d){
 clientePautas=(d.pautas||[]).filter(x=>x&&Array.isArray(x.posts)).sort((a,b)=>(b.ano-a.ano)||(b.mes-a.mes));
 $("#sairBtn").hidden=false;
 if(!clientePautas.length){$("#result").innerHTML=`<section class="panel gate"><h2>Nenhuma pauta ainda</h2><p>A pauta do mês aparece aqui assim que estiver pronta.</p></section>`;return}
 const n=new Date();current=clientePautas.find(x=>x.ano===n.getFullYear()&&x.mes===n.getMonth())||clientePautas[0];
 filtroFormato="Todos";filtroPilar=null;renderResult();
 if(!downloads&&window.claude&&window.claude.use)window.claude.use("downloads").then(d=>{if(d){downloads=d;if(current)renderResult()}}).catch(()=>{})}
$("#sairBtn").onclick=()=>{lsSet(null);clientePautas=[];gateCliente()};

/* ---------- Boot ---------- */
if(modoCliente)startCliente();
else (async()=>{
 renderResult();
 const c=window.claude;
 if(!c||!c.use){setNote("Abra esta página no Claude para gerar pautas.",true);return}
 const [s,d,dl,us,ar]=await Promise.all([c.use("sample"),c.use("db"),c.use("downloads"),c.use("user"),c.use("artifact")]);
 /* Only the isadsign account sees the generator; anyone else who opens the bare link gets a pointer to their own link */
 dono=us?await us.canEdit().catch(()=>false):!!d;
 if(!dono){document.body.classList.add("cliente");$("#result").innerHTML=`<section class="panel gate"><p class="eyebrow">Pauta isadsign</p><h2>Use o seu link</h2><p>Para ver a sua pauta, abra o link completo que a isadsign enviou para você e digite o seu código de acesso.</p></section>`;return}
 sample=s;db=d;downloads=dl;artifactCap=ar;
 try{const v=JSON.parse(sessionStorage.getItem("pauta-volta")||"null");if(v){sessionStorage.removeItem("pauta-volta");pastaAberta=v.pasta||null;showView(v.view||"clientes");if(v.msg)toast(v.msg)}}catch(e){}
 if(!sample)setNote("Gerar pauta funciona quando a página está aberta no Claude.",true);
 else{try{const lim=await sample.limits();imgLimits=lim&&lim.images||null}catch(e){imgLimits=null}}
 if(!imgLimits){$("#fFiles").accept="application/pdf";$("#dropHint").textContent="PDF do cliente (catálogo, apresentação, cardápio). Para prints, abra a página no Claude."}
 else $("#dropHint").textContent=`Prints do Instagram, fotos, catálogo ou apresentação em PDF. Até ${imgLimits.maxCount} imagens. Toque, arraste ou cole aqui.`;
 updateTotal();renderResult();
 if(db){db.collection("pautas").orderBy("criadoEm","desc").limit(200).onSnapshot(snap=>{
   saved=snap.docs.map(x=>x.data()).filter(Boolean);updateClientes();
   if(current&&current.exemplo&&saved.length&&!busy){current=JSON.parse(JSON.stringify(saved[0]));renderResult()}
   if(!$("#viewSalvas").hidden)renderSaved();if(!$("#viewClientes").hidden)renderClientes()},()=>{});
  db.collection("config").onSnapshot(snap=>{const g=snap.docs.find(x=>x.id==="geral");cfg=(g&&g.data())||{};cfgOk=true;if(!$("#viewClientes").hidden)renderClientes();sincronizarPortal()},()=>{cfgOk=true});
  db.collection("acessos").onSnapshot(snap=>{acessos=snap.docs.map(x=>({...x.data(),id:x.id})).filter(a=>a&&a.cliente&&a.url).sort((a,b)=>a.cliente.localeCompare(b.cliente,"pt"));acessosOk=true;if(!$("#viewClientes").hidden)renderClientes();sincronizarPortal()},()=>{});
  db.collection("clientes").onSnapshot(snap=>{clientes={};snap.docs.forEach(x=>{const c=x.data();if(c&&c.nome)clientes[x.id]=c});updateClientes();paintPerfilHint();if(!$("#viewClientes").hidden)renderClientes()},()=>{})}
})();
})();
</script>
