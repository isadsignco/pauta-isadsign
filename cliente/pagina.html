<title>Pauta isadsign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<style>
/* Layout: frosted top bar; a code gate first, then the month (hero, próximo post, calendário, posts, estratégia, marca) stacked in one column. Post opens in a sheet. Read-only. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f0f0f3; --fg:#1d1d1f; --fg-2:#6e6e73; --line:rgba(0,0,0,.09);
  --accent:#d6237f; --accent-soft:rgba(214,35,127,.1); --on-accent:#ffffff; --danger:#d70015;
  --c-car:#d6237f; --c-reel:#5856d6; --c-est:#c76a00; --c-sto:#248a3d;
  --bar:rgba(245,245,247,.78); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:1.375rem; --r-md:0.875rem; --r-sm:0.625rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f5f5f7; --fg-2:#98989d; --line:rgba(255,255,255,.1);
  --accent:#ff4fa3; --accent-soft:rgba(255,79,163,.16); --on-accent:#1a0010; --danger:#ff6961;
  --c-car:#ff4fa3; --c-reel:#7d7aff; --c-est:#ffb340; --c-sto:#4cd964;
  --bar:rgba(22,22,24,.72); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f5f5f7; --fg-2:#98989d; --line:rgba(255,255,255,.1);
  --accent:#ff4fa3; --accent-soft:rgba(255,79,163,.16); --on-accent:#1a0010; --danger:#ff6961;
  --c-car:#ff4fa3; --c-reel:#7d7aff; --c-est:#ffb340; --c-sto:#4cd964;
  --bar:rgba(22,22,24,.72); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

html{font-size:16px;-webkit-text-size-adjust:100%}
@media (min-width:1800px){html{font-size:19px}}
@media (min-width:2400px){html{font-size:24px}}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}

.wrap{max-width:64rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;height:3.25rem}
.brand{font-weight:600;font-size:1.0625rem;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.brand small{font-weight:400;color:var(--fg-2);margin-left:.35rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:999px;padding:.6rem 1.15rem;font-size:.9375rem;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.link{background:none;color:var(--accent);padding:.4rem .2rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:.35rem .8rem;font-size:.8125rem}

/* Gate */
.gate{max-width:26rem;margin:4rem auto;padding:2rem 1.5rem;text-align:center}
.gate .eyebrow{justify-content:center}
.gate h1{font-size:clamp(1.75rem,6vw,2.25rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 .5rem;text-wrap:balance}
.gate p{color:var(--fg-2);margin:0 0 1.5rem;text-wrap:pretty}
.gate form{display:flex;flex-direction:column;gap:.75rem}
.gate input[type=text]{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);padding:.8rem .9rem;font-family:var(--mono);font-size:1.25rem;letter-spacing:.12em;text-align:center;text-transform:uppercase;outline:none}
.gate input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
.gate .btn.primary{padding:.8rem 1rem;font-size:1rem}
.gate .remember{display:flex;align-items:center;justify-content:center;gap:.45rem;font-size:.875rem;color:var(--fg-2)}
.gate .err{color:var(--danger);font-size:.875rem;margin:0}

.hero{padding-block:2.75rem 1.5rem}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--accent);margin:0 0 .4rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.hero h1{font-size:clamp(2.1rem,6vw,3.5rem);line-height:1.04;letter-spacing:-.035em;font-weight:700;margin:0;text-wrap:balance}
.hero p.sub{color:var(--fg-2);font-size:clamp(1.0625rem,1.6vw,1.25rem);margin:.75rem 0 0;max-width:40rem;text-wrap:pretty}
.months{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.25rem}
.months button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.35rem .85rem;font-size:.8125rem}
.months button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.counts{display:flex;flex-wrap:wrap;gap:1.75rem;margin-top:1.5rem}
.count b{display:block;font-size:1.875rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:.8125rem;color:var(--fg-2);display:flex;align-items:center;gap:.35rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block;flex:none}

.stack{display:flex;flex-direction:column;gap:1.25rem;padding-bottom:3rem}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card{padding:1.4rem 1.5rem}
@media (max-width:640px){.card{padding:1.15rem 1.1rem}}
.card h2{font-size:1.25rem;letter-spacing:-.02em;margin:0 0 .25rem;font-weight:600}
.card .lead{color:var(--fg-2);margin:0 0 1.1rem;max-width:44rem;text-wrap:pretty}

.next{display:flex;gap:1rem;align-items:center;padding:1.1rem 1.25rem;border:0;width:100%;text-align:left;background:var(--accent-soft);border-radius:var(--r-lg)}
.next .d{flex:none;width:3.5rem;height:3.5rem;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.next .d b{font-size:1.375rem;font-variant-numeric:tabular-nums}
.next .d small{font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;margin-top:.15rem}
.next .t{min-width:0}
.next .t span{font-size:.8125rem;color:var(--accent);font-weight:600}
.next .t h3{margin:.1rem 0 0;font-size:1.0625rem;letter-spacing:-.015em;line-height:1.3}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem 1.5rem}
.fact h4,.kv b,.sec h5{margin:0 0 .25rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.fact p{margin:0;font-size:.9375rem;line-height:1.45}
.fact ul{margin:0;padding-left:1.1rem;font-size:.9375rem;line-height:1.45}

.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.75rem}
.pillar{border:1px solid var(--line);border-radius:var(--r-md);padding:.9rem 1rem;text-align:left;background:transparent;display:flex;flex-direction:column;gap:.35rem}
.pillar[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pillar .pt{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-weight:600}
.pillar .pct{font-variant-numeric:tabular-nums;color:var(--fg-2);font-weight:500;font-size:.875rem}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pillar p{margin:0;font-size:.875rem;color:var(--fg-2);line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin-top:1rem;font-size:.875rem;color:var(--fg-2)}
.meta b{color:var(--fg);font-weight:500}

.cal-legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8125rem;color:var(--fg-2);margin-bottom:.9rem}
.cal-legend span{display:flex;align-items:center;gap:.35rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem}
.dow{font-size:.75rem;font-weight:600;color:var(--fg-2);text-align:center;padding-bottom:.25rem;text-transform:uppercase;letter-spacing:.04em}
.day{min-height:5.5rem;border-radius:var(--r-sm);background:var(--surface-2);padding:.4rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.day.empty{background:transparent}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .n{font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums}
.day .hol{font-size:.6875rem;color:var(--accent);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{border:0;border-radius:.4rem;padding:.2rem .35rem;font-size:.6875rem;font-weight:600;text-align:left;color:var(--on-accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.pill.Carrossel{background:var(--c-car)} .pill.Reels{background:var(--c-reel)} .pill.Estático{background:var(--c-est)} .pill.Stories{background:var(--c-sto)}
@media (max-width:640px){.day{min-height:3.6rem;padding:.3rem}.pill{font-size:0;height:.55rem;padding:0;border-radius:3px}.day .hol{display:none}.cal{gap:.25rem}}

.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.toolbar h2{margin:0}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:.6rem;padding:2px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:.3rem .85rem;border-radius:.5rem;font-size:.8125rem;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.75rem}
.post{border:1px solid var(--line);border-radius:var(--r-md);padding:1rem;text-align:left;background:transparent;display:flex;flex-direction:column;gap:.45rem;min-width:0;transition:border-color .15s}
.post:hover{border-color:var(--fg-2)}
.post.past{opacity:.6}
.post .pm{display:flex;align-items:center;gap:.45rem;font-size:.8125rem;color:var(--fg-2);font-variant-numeric:tabular-nums}
.post h3{margin:0;font-size:1.0625rem;letter-spacing:-.015em;font-weight:600;line-height:1.3}
.post p{margin:0;font-size:.875rem;color:var(--fg-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{color:var(--fg-2);font-size:.8125rem;text-align:center;padding:0 0 3rem;display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;align-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:var(--r-lg);width:min(46rem,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sh-top{position:sticky;top:0;background:var(--surface);padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--line);display:flex;gap:.75rem;align-items:flex-start;z-index:1}
.sh-top .t{flex:1;min-width:0}
.sh-top h2{margin:.15rem 0 0;font-size:1.375rem;letter-spacing:-.025em;line-height:1.2}
.sh-top .when{margin:.25rem 0 0;color:var(--fg-2);font-size:.875rem}
.x{border:0;background:var(--surface-2);width:2rem;height:2rem;border-radius:50%;font-size:1rem;flex:none}
.sh-body{padding:1.1rem 1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.25rem}
.sec h5{margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.sec h5 button{text-transform:none;letter-spacing:0;font-size:.8125rem;font-weight:500;border:0;background:none;color:var(--accent);padding:0}
.desc{font-size:1rem;line-height:1.55;margin:0;max-width:40rem;text-wrap:pretty}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.75rem}
.kv div{background:var(--surface-2);border-radius:var(--r-sm);padding:.7rem .85rem}
.kv b{display:block;margin-bottom:.2rem}
.kv span{font-size:.9375rem;line-height:1.4}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.check li{display:grid;grid-template-columns:1.1rem minmax(0,1fr);gap:.55rem;font-size:.9375rem;line-height:1.4}
.check li::before{content:"";width:.95rem;height:.95rem;margin-top:.15rem;border-radius:.3rem;border:1.5px solid var(--fg-2)}
.hook{background:var(--surface-2);border-radius:var(--r-sm);padding:.7rem .85rem;margin-bottom:.4rem;font-weight:500}
.slides{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.35rem;scroll-snap-type:x mandatory}
.slide{flex:0 0 min(15rem,78%);aspect-ratio:4/5;max-width:100%;background:var(--surface-2);border-radius:var(--r-md);padding:1rem;scroll-snap-align:start;display:flex;flex-direction:column;gap:.5rem;overflow:auto}
.slide .sn{font-size:.75rem;color:var(--fg-2);font-variant-numeric:tabular-nums}
.slide b{font-size:1.0625rem;letter-spacing:-.015em;line-height:1.25}
.slide p{margin:0;font-size:.875rem;line-height:1.4}
.script{display:flex;flex-direction:column;gap:.5rem}
.beat{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.75rem;border-top:1px solid var(--line);padding-top:.55rem}
.beat:first-child{border-top:0;padding-top:0}
.beat .tm{font-family:var(--mono);font-size:.8125rem;color:var(--accent);padding-top:.1rem}
.beat p{margin:0 0 .2rem}
.beat .sm{font-size:.8125rem;color:var(--fg-2)}
.caption{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r-sm);padding:.85rem .95rem;font-size:.9375rem;line-height:1.5}
.sh-nav{display:flex;justify-content:space-between;gap:.5rem;padding:.75rem 1.25rem 1.1rem;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-size:.875rem;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Pauta <small>isadsign</small></div>
    <button type="button" class="btn sm" id="sairBtn" hidden>Sair</button>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" id="sheet"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Pauta do cliente, criptografada com o código de acesso (PBKDF2-SHA256 + AES-GCM). Gerado por cliente/gerar.mjs. */
const ACESSO=/*ACESSO*/null/*FIM*/;
(function(){
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const DIAS_C=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const FORMATOS=["Carrossel","Reels","Estático","Stories"];
const FCOLOR={Carrossel:"var(--c-car)",Reels:"var(--c-reel)","Estático":"var(--c-est)",Stories:"var(--c-sto)"};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysIn=(m,y)=>new Date(y,m+1,0).getDate();
const dow=(d,m,y)=>new Date(y,m,d).getDay();
const LS="pauta-codigo";

let pautas=[], p=null, filtroFormato="Todos", filtroPilar=null, openId=null;

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch(e){toast("Selecione o texto e copie")}}
function sorted(){return [...p.posts].sort((a,b)=>a.dia-b.dia||FORMATOS.indexOf(a.formato)-FORMATOS.indexOf(b.formato))}
function today(){const n=new Date();return n.getFullYear()===p.ano&&n.getMonth()===p.mes?n.getDate():null}
function isPast(x){return new Date(p.ano,p.mes,x.dia+1)<=new Date()}
const lsGet=()=>{try{return localStorage.getItem(LS)}catch(e){return null}};
const lsSet=v=>{try{v?localStorage.setItem(LS,v):localStorage.removeItem(LS)}catch(e){}};

/* ---------- Código de acesso ---------- */
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
async function abrir(codigo){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(codigo)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(ACESSO.salt),iterations:ACESSO.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(ACESSO.iv)},key,ub(ACESSO.data)));
  return JSON.parse(txt)}

function gate(err){
  $("#sairBtn").hidden=true;
  $("#app").innerHTML=`<section class="panel gate"><p class="eyebrow">Sua pauta de conteúdo</p><h1>${esc(ACESSO?ACESSO.cliente:"Pauta")}</h1><p>Digite o código de acesso que a isadsign enviou para você.</p>
  <form id="gateForm" autocomplete="off"><label for="codigo" class="eyebrow" style="justify-content:center;color:var(--fg-2)">Código de acesso</label><input type="text" id="codigo" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12" required>
  <label class="remember"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
  ${err?`<p class="err" role="alert">${esc(err)}</p>`:""}<button type="submit" class="btn primary" id="entrarBtn">Ver minha pauta</button></form></section>`;
  const f=$("#gateForm"),inp=$("#codigo");
  inp.addEventListener("input",()=>{const v=norm(inp.value).slice(0,8);inp.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v});
  f.addEventListener("submit",async e=>{e.preventDefault();const b=$("#entrarBtn");b.disabled=true;b.textContent="Abrindo…";
    try{const d=await abrir(inp.value);if($("#lembrar").checked)lsSet(norm(inp.value));entrar(d)}
    catch(_){gate("Código incorreto. Confira as letras e os números e tente de novo.");$("#codigo").focus()}});
  setTimeout(()=>inp.focus(),50)}

function entrar(d){
  pautas=(d.pautas||[]).filter(x=>x&&Array.isArray(x.posts)).sort((a,b)=>(b.ano-a.ano)||(b.mes-a.mes));
  if(!pautas.length){$("#app").innerHTML=`<section class="panel gate"><h1>Nenhuma pauta ainda</h1><p>A pauta do mês aparece aqui assim que estiver pronta.</p></section>`;return}
  const n=new Date();p=pautas.find(x=>x.ano===n.getFullYear()&&x.mes===n.getMonth())||pautas[0];
  $("#sairBtn").hidden=false;render()}
$("#sairBtn").onclick=()=>{lsSet(null);pautas=[];p=null;gate()};

/* ---------- Página ---------- */
function render(){
  const mes=MESES[p.mes];
  document.title=`${p.cliente} · Pauta de ${mes}`;
  const counts=FORMATOS.map(f=>[f,p.posts.filter(x=>x.formato===f).length]).filter(c=>c[1]);
  let h=`<section class="hero"><p class="eyebrow">${esc(p.arroba||p.nicho||"Pauta")}</p>
  <h1>${esc(p.cliente)}: sua pauta de ${mes.toLowerCase()}</h1>
  <p class="sub">${p.estrategia&&p.estrategia.resumo?esc(p.estrategia.resumo):`Tudo o que vai ao ar em ${mes.toLowerCase()} de ${p.ano}.`}</p>
  ${pautas.length>1?`<div class="months" role="group" aria-label="Escolher mês">${pautas.map((x,i)=>`<button type="button" data-mes="${i}" aria-pressed="${x===p}">${MESES[x.mes]} ${x.ano}</button>`).join("")}</div>`:""}
  <div class="counts"><div class="count"><b>${p.posts.length}</b><span>posts no mês</span></div>${counts.map(([f,n])=>`<div class="count"><b>${n}</b><span><i class="dot" style="background:${FCOLOR[f]}"></i>${f}</span></div>`).join("")}</div></section>
  <div class="stack">`;
  const t=today(),nx=t?sorted().find(x=>x.dia>=t):null;
  if(nx)h+=`<button type="button" class="next" data-post="${esc(nx.id)}"><span class="d"><b>${nx.dia}</b><small>${DIAS_C[dow(nx.dia,p.mes,p.ano)]}</small></span><span class="t"><span>${nx.dia===t?"Hoje":"Próximo post"} · ${esc(nx.formato)}</span><h3>${esc(nx.titulo||nx.tema)}</h3></span></button>`;
  h+=calendarHTML()+postsHTML()+strategyHTML()+profileHTML()+`</div><p class="foot">Pauta feita pela isadsign · @isadsign.co</p>`;
  $("#app").innerHTML=h;
  bind();window.scrollTo({top:0});
}
function bind(){
  const a=$("#app");
  a.querySelectorAll("[data-mes]").forEach(b=>b.onclick=()=>{p=pautas[+b.dataset.mes];filtroFormato="Todos";filtroPilar=null;render()});
  a.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>openPost(b.dataset.post));
  a.querySelectorAll(".pillar").forEach(b=>b.onclick=()=>{filtroPilar=filtroPilar===b.dataset.pilar?null:b.dataset.pilar;a.querySelectorAll(".pillar").forEach(x=>x.setAttribute("aria-pressed",x.dataset.pilar===filtroPilar));rerenderPosts();if(filtroPilar)$("#postsCard").scrollIntoView({behavior:"smooth",block:"start"})});
  bindPosts();
}
function bindPosts(){const c=$("#postsCard");
  c.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>openPost(b.dataset.post));
  c.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{filtroFormato=b.dataset.filtro;rerenderPosts()});
  const cl=$("#clearPilar");if(cl)cl.onclick=()=>{filtroPilar=null;document.querySelectorAll(".pillar").forEach(x=>x.setAttribute("aria-pressed","false"));rerenderPosts()}}
function rerenderPosts(){$("#postsCard").outerHTML=postsHTML();bindPosts()}

function calendarHTML(){
  const n=daysIn(p.mes,p.ano),first=dow(1,p.mes,p.ano),t=today();
  const byDay={};p.posts.forEach(x=>{(byDay[x.dia]=byDay[x.dia]||[]).push(x)});
  const hol={};((p.estrategia&&p.estrategia.datas)||[]).forEach(d=>hol[d.dia]=d.nome);
  let cells=DIAS_C.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first;i++)cells+=`<div class="day empty" aria-hidden="true"></div>`;
  for(let d=1;d<=n;d++)cells+=`<div class="day${d===t?" today":""}"><span class="n">${d}</span>${hol[d]?`<span class="hol">${esc(hol[d])}</span>`:""}${(byDay[d]||[]).map(x=>`<button type="button" class="pill ${esc(x.formato)}" data-post="${esc(x.id)}" aria-label="${esc(x.formato+", dia "+d+": "+(x.titulo||x.tema))}" title="${esc(x.formato+": "+(x.titulo||x.tema))}">${esc(x.formato)}</button>`).join("")}</div>`;
  return `<section class="panel card"><h2>Calendário</h2><p class="lead">Toque em um post para ver o conteúdo completo.</p><div class="cal-legend">${FORMATOS.filter(f=>p.posts.some(x=>x.formato===f)).map(f=>`<span><i class="dot" style="background:${FCOLOR[f]}"></i>${f}</span>`).join("")}</div><div class="cal">${cells}</div></section>`}

function postsHTML(){
  const present=FORMATOS.filter(f=>p.posts.some(x=>x.formato===f));
  const list=sorted().filter(x=>(filtroFormato==="Todos"||x.formato===filtroFormato)&&(!filtroPilar||x.pilar===filtroPilar));
  return `<section class="panel card" id="postsCard"><div class="toolbar"><h2>Posts</h2>${present.length>1?`<div class="seg" role="group" aria-label="Filtrar por formato">${["Todos",...present].map(f=>`<button type="button" data-filtro="${f}" aria-pressed="${filtroFormato===f}">${f}</button>`).join("")}</div>`:""}</div>
  ${filtroPilar?`<p class="lead">Pilar: ${esc(filtroPilar)} · <button type="button" class="btn link" id="clearPilar">ver todos</button></p>`:""}
  <div class="posts">${list.map(x=>`<button type="button" class="post${isPast(x)?" past":""}" data-post="${esc(x.id)}"><span class="pm"><i class="dot" style="background:${FCOLOR[x.formato]}"></i>${esc(x.formato)} · ${DIAS_C[dow(x.dia,p.mes,p.ano)]}, ${x.dia}/${p.mes+1}${x.pilar?" · "+esc(x.pilar):""}</span><h3>${esc(x.titulo||x.tema)}</h3><p>${esc(x.descricao||(x.ganchos||[])[0]||x.objetivo||"")}</p></button>`).join("")||`<p class="lead">Nenhum post com esse filtro.</p>`}</div></section>`}

function strategyHTML(){
  const e=p.estrategia;if(!e)return "";
  const tm=(p.briefing&&p.briefing.temas)||[];
  return `<section class="panel card"><h2>Estratégia do mês</h2><p class="lead">${p.objetivo?`Objetivo: ${esc(p.objetivo)}. `:""}Os pilares mostram como o conteúdo se divide. Toque em um para ver só os posts dele.</p>
  <div class="pillars">${(e.pilares||[]).map(pl=>`<button type="button" class="pillar" data-pilar="${esc(pl.nome)}" aria-pressed="${filtroPilar===pl.nome}"><span class="pt">${esc(pl.nome)}<span class="pct">${+pl.pct||0}%</span></span><span class="bar"><i style="width:${Math.min(100,+pl.pct||0)}%"></i></span><p>${esc(pl.descricao)}</p></button>`).join("")}</div>
  <div class="meta">${e.frequencia?`<span><b>Frequência</b> ${esc(e.frequencia)}</span>`:""}${(e.datas||[]).length?`<span><b>Datas do mês</b> ${e.datas.map(d=>`${+d.dia}/${p.mes+1} ${esc(d.nome)}`).join(" · ")}</span>`:""}${tm.length?`<span><b>Temas</b> ${tm.map(esc).join(" · ")}</span>`:""}</div></section>`}

function profileHTML(){
  const pf=p.perfil;if(!pf||!(pf.resumo||(pf.produtos||[]).length))return "";
  const li=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<section class="panel card"><h2>Como entendemos a sua marca</h2><p class="lead">${esc(pf.resumo)}</p><div class="facts">
  ${(pf.produtos||[]).length?`<div class="fact"><h4>Produtos e serviços</h4>${li(pf.produtos.slice(0,6))}</div>`:""}
  ${pf.publico?`<div class="fact"><h4>Público</h4><p>${esc(pf.publico)}</p></div>`:""}
  ${pf.tom?`<div class="fact"><h4>Tom de voz</h4><p>${esc(pf.tom)}</p></div>`:""}
  ${(pf.diferenciais||[]).length?`<div class="fact"><h4>Diferenciais</h4>${li(pf.diferenciais.slice(0,5))}</div>`:""}
  ${pf.visual?`<div class="fact"><h4>Identidade visual</h4><p>${esc(pf.visual)}</p></div>`:""}</div></section>`}

/* ---------- Post ---------- */
function whenTxt(x){return `${DIAS[dow(x.dia,p.mes,p.ano)]}, ${x.dia} de ${MESES[p.mes].toLowerCase()}`}
function postBody(x){
  const cp=k=>` <button type="button" data-copy="${k}">Copiar</button>`;
  let b="";
  if(x.descricao)b+=`<div class="sec"><h5>O que é este post</h5><p class="desc">${esc(x.descricao)}</p></div>`;
  b+=`<div class="sec kv">${x.objetivo?`<div><b>Objetivo</b><span>${esc(x.objetivo)}</span></div>`:""}${x.horario?`<div><b>Quando vai ao ar</b><span>${esc(x.horario)}</span></div>`:""}${x.metrica?`<div><b>Como vamos medir</b><span>${esc(x.metrica)}</span></div>`:""}</div>`;
  if((x.producao||[]).length)b+=`<div class="sec"><h5>O que precisamos para produzir</h5><ul class="check">${x.producao.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  if(x.visual)b+=`<div class="sec"><h5>Visual</h5><p style="margin:0">${esc(x.visual)}</p></div>`;
  if((x.ganchos||[]).length)b+=`<div class="sec"><h5>Frases de abertura</h5>${x.ganchos.map(g=>`<div class="hook">${esc(g)}</div>`).join("")}</div>`;
  if((x.slides||[]).length)b+=`<div class="sec"><h5>Slides${cp("slides")}</h5><div class="slides">${x.slides.map((s,k)=>`<div class="slide"><span class="sn">${k+1}/${x.slides.length}</span><b>${esc(s.titulo)}</b><p>${esc(s.texto)}</p></div>`).join("")}</div></div>`;
  if((x.roteiro||[]).length)b+=`<div class="sec"><h5>Roteiro${cp("roteiro")}</h5><div class="script">${x.roteiro.map(r=>`<div class="beat"><span class="tm">${esc(r.tempo)}</span><div><p>${esc(r.fala)}</p><div class="sm">Cena: ${esc(r.cena)}</div>${r.texto_tela?`<div class="sm">Na tela: ${esc(r.texto_tela)}</div>`:""}</div></div>`).join("")}</div></div>`;
  if(x.arte)b+=`<div class="sec"><h5>Arte</h5><div class="hook">${esc(x.arte.frase)}</div><p style="margin:.3rem 0 0;color:var(--fg-2)">${esc(x.arte.direcao)}</p></div>`;
  if((x.telas||[]).length)b+=`<div class="sec"><h5>Telas dos Stories${cp("telas")}</h5><div class="script">${x.telas.map((t,k)=>`<div class="beat"><span class="tm">Tela ${k+1}</span><div><p>${esc(t.texto)}</p>${t.recurso?`<div class="sm">Recurso: ${esc(t.recurso)}</div>`:""}</div></div>`).join("")}</div></div>`;
  if(x.legenda)b+=`<div class="sec"><h5>Legenda${cp("legenda")}</h5><div class="caption">${esc(x.legenda)}${(x.hashtags||[]).length?"\n\n"+esc(x.hashtags.join(" ")):""}</div></div>`;
  if(x.cta)b+=`<div class="sec"><h5>Chamada para ação</h5><p style="margin:0">${esc(x.cta)}</p></div>`;
  return b}
function openPost(id){openId=id;renderSheet();$("#scrim").hidden=false;document.body.style.overflow="hidden";setTimeout(()=>{const x=$("#sheet .x");x&&x.focus()},30)}
function closeSheet(){$("#scrim").hidden=true;document.body.style.overflow="";openId=null}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(!openId)return;if(e.key==="Escape")closeSheet();if(e.key==="ArrowRight"){const n=$("#nextP");n&&!n.disabled&&n.click()}if(e.key==="ArrowLeft"){const v=$("#prevP");v&&!v.disabled&&v.click()}});
function renderSheet(){
  const list=sorted(),i=list.findIndex(x=>x.id===openId),x=list[i];if(!x)return closeSheet();
  $("#sheet").innerHTML=`<div class="sh-top"><div class="t"><p class="eyebrow"><i class="dot" style="background:${FCOLOR[x.formato]}"></i>${esc(x.formato)}${x.pilar?" · "+esc(x.pilar):""}</p><h2 id="shTitle">${esc(x.titulo||x.tema)}</h2><p class="when">${esc(whenTxt(x))}</p></div><button type="button" class="x" aria-label="Fechar">✕</button></div>
  <div class="sh-body">${postBody(x)}</div>
  <div class="sh-nav"><button type="button" class="btn link" id="prevP" ${i===0?"disabled":""}>‹ Anterior</button><span style="align-self:center;color:var(--fg-2);font-size:.8125rem;font-variant-numeric:tabular-nums">${i+1} de ${list.length}</span><button type="button" class="btn link" id="nextP" ${i===list.length-1?"disabled":""}>Próximo ›</button></div>`;
  $("#sheet .x").onclick=closeSheet;
  $("#prevP").onclick=()=>{if(i>0){openId=list[i-1].id;renderSheet();$("#sheet").scrollTop=0}};
  $("#nextP").onclick=()=>{if(i<list.length-1){openId=list[i+1].id;renderSheet();$("#sheet").scrollTop=0}};
  $("#sheet").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const k=b.dataset.copy;
    if(k==="slides")copy(x.slides.map((s,j)=>`${j+1}. ${s.titulo}\n${s.texto}`).join("\n\n"));
    if(k==="roteiro")copy(x.roteiro.map(r=>`[${r.tempo}] ${r.fala}\nCena: ${r.cena}${r.texto_tela?"\nNa tela: "+r.texto_tela:""}`).join("\n\n"));
    if(k==="telas")copy(x.telas.map((t,j)=>`Tela ${j+1}: ${t.texto}${t.recurso?" ("+t.recurso+")":""}`).join("\n"));
    if(k==="legenda")copy(x.legenda+((x.hashtags||[]).length?"\n\n"+x.hashtags.join(" "):""))});
}

/* ---------- Início ---------- */
if(!ACESSO){$("#app").innerHTML=`<section class="panel gate"><h1>Página sem pauta</h1><p>Esta página ainda não recebeu a pauta de nenhum cliente.</p></section>`}
else{const salvo=lsGet();if(salvo)abrir(salvo).then(entrar).catch(()=>{lsSet(null);gate()});else gate()}
})();
</script>
