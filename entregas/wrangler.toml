name = "entregas-isadsign"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "404-page"

[[r2_buckets]]
binding = "ARQ"
bucket_name = "entregas-isadsign"

# Limpeza dos arquivos com mais de 30 dias e leitura dos clientes do Demandas, a cada 6 horas
[triggers]
crons = ["17 */6 * * *"]

[observability]
enabled = true
